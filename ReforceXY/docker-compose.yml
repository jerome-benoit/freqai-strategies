---
services:
  freqtrade:
    # image: freqtradeorg/freqtrade:stable_freqairl
    # # Enable GPU Image and GPU Resources
    # # Make sure to uncomment the whole deploy section
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    # Build step - only needed when additional dependencies are needed
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        cmaes_version: 0.13.0
        freqtrade_image: ${REFORCEXY_FREQTRADE_IMAGE:-freqtradeorg/freqtrade@sha256:e808ec0d6c14cf5a2ea8406093b05e8b9230ac363ebdac573101988cd1450410}
        reforcexy_git_commit: ${REFORCEXY_GIT_COMMIT:-}
        scipy_version: 1.17.1
        optuna_version: 4.9.0
        optuna_dashboard_version: 0.20.0
        optunahub_version: 0.4.1
        matplotlib_version: 3.11.1
        gymnasium_version: 1.3.0
        runtime_requirements_sha256: ${REFORCEXY_RUNTIME_REQUIREMENTS_SHA256:-}
        sb3_contrib_version: 2.9.0
        stable_baselines3_version: 2.9.0
    restart: unless-stopped
    container_name: freqtrade-ReforceXY
    environment:
      - TZ=Europe/Paris
      - REFORCEXY_GIT_COMMIT=${REFORCEXY_GIT_COMMIT:-}
      - REFORCEXY_MANIFEST_SOURCE_SHA256=${REFORCEXY_MANIFEST_SOURCE_SHA256:-}
      - REFORCEXY_MODEL_SOURCE_SHA256=${REFORCEXY_MODEL_SOURCE_SHA256:-}
      - REFORCEXY_RUNTIME_IMAGE_ID=${REFORCEXY_RUNTIME_IMAGE_ID:-}
    volumes:
      - "./user_data:/freqtrade/user_data"
    # Expose the API on localhost port 8082
    # Please read the https://www.freqtrade.io/en/stable/rest-api/ documentation
    # for more information.
    ports:
      - "127.0.0.1:8082:8080"
    # Default command used when running `docker compose up`
    command: trade
