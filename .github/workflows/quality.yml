name: Quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: .github/workflows/quality.yml
      - name: Check repository
        run: uvx ruff@latest check .
      - name: Check repository formatting
        run: uvx ruff@latest format --check .

  strategy-qa:
    name: QA (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: QuickAdapter
            context: quickadapter
            project: quickadapter
            image: freqai-strategies-quickadapter-qa:ci
            coverage: true
          - name: ReforceXY
            context: ReforceXY
            project: reforcexy
            image: freqai-strategies-reforcexy-qa:ci
            coverage: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build QA image
        run: >-
          docker build --pull --target qa
          --tag "${{ matrix.image }}"
          "${{ matrix.context }}"
      - name: Check types
        run: |
          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            --entrypoint python \
            "${{ matrix.image }}" \
            /workspace/scripts/check_basedpyright.py \
            --project "${{ matrix.project }}"
      - name: Run runtime regressions
        if: ${{ !matrix.coverage }}
        run: |
          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            --workdir /workspace \
            --env PYTHONPATH=/workspace/${{ matrix.context }}/user_data/strategies \
            --entrypoint python \
            "${{ matrix.image }}" \
            -m unittest discover -s "${{ matrix.context }}/tests" -v
      - name: Run runtime regressions with coverage
        if: matrix.coverage
        run: |
          docker run --rm \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            --workdir /workspace \
            --env PYTHONPATH=/workspace/${{ matrix.context }}/user_data/strategies \
            --env COVERAGE_RCFILE=/workspace/${{ matrix.context }}/.coveragerc \
            --env COVERAGE_FILE=/tmp/.coverage \
            --entrypoint sh \
            "${{ matrix.image }}" \
            -c '
              set -eu
              python -m coverage run -m unittest discover -s "${{ matrix.context }}/tests" -v
              echo "::group::Coverage"
              status=0
              python -m coverage report || status=$?
              echo "::endgroup::"
              exit $status
            '

  reward-space-analysis:
    name: Reward space analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: ReforceXY/reward_space_analysis/uv.lock
      - name: Run analysis regressions
        working-directory: ReforceXY/reward_space_analysis
        run: uv run --locked --extra dev pytest
